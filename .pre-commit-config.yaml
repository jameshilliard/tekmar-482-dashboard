repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock
        language: system
        entry: uv lock
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: ruff
        name: ruff check
        language: system
        entry: uv run --frozen ruff check --fix
        types: [python]
      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run --frozen ruff format
        types: [python]
      - id: mypy
        name: mypy
        language: system
        entry: uv run --frozen mypy
        pass_filenames: false
        types: [python]
